<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grist Search Widget</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  /* ============================================================
     THEME — tweak these variables to restyle the whole widget
     ============================================================ */
  :root {
    --bg: #ffffff;
    --panel-bg: #f7f7f8;
    --border: #e3e3e6;
    --text: #1c1c1e;
    --text-dim: #6b6b70;
    --accent: #16795c;       /* buttons, active states */
    --accent-soft: #e6f4ef;  /* pills, hover backgrounds */
    --danger: #b3261e;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    font-size: 13px;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ---------- Top bar: table picker + search ---------- */
  #topbar {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-bg);
    flex-wrap: wrap;
  }

  select, input[type="text"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: #fff;
    color: var(--text);
    outline: none;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  #tableSelect { min-width: 160px; }
  #searchInput { flex: 1; min-width: 160px; }

  #status {
    padding: 2px 12px;
    font-size: 11px;
    color: var(--text-dim);
    min-height: 16px;
  }
  #status.error { color: var(--danger); }

  /* ---------- Main layout ---------- */
  #main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  #resultsPane {
    width: 280px;
    min-width: 200px;
    max-width: 40%;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    background: var(--panel-bg);
  }

  #detailPane {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
  }

  @media (max-width: 560px) {
    #main { flex-direction: column; }
    #resultsPane { width: 100%; max-width: 100%; max-height: 40%; }
  }

  /* ---------- Results list ---------- */
  .result-item {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .result-item:hover { background: var(--accent-soft); }
  .result-item.active {
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    padding-left: 9px;
  }
  .result-title { font-weight: 600; }
  .result-sub { color: var(--text-dim); font-size: 11.5px; margin-top: 2px; }

  .empty-msg {
    padding: 20px 14px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  /* ---------- Breadcrumbs ---------- */
  #breadcrumbs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
    margin-bottom: 14px;
  }
  .crumb {
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    cursor: pointer;
    font-size: 12px;
    color: var(--text-dim);
  }
  .crumb:hover { background: var(--accent-soft); color: var(--text); }
  .crumb.current {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    cursor: default;
    font-weight: 600;
  }
  .crumb-sep { color: var(--border); }

  /* ---------- Detail record ---------- */
  .detail-header {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .detail-subheader {
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 16px;
  }

  .field-table {
    width: 100%;
    border-collapse: collapse;
  }
  .field-table tr { border-bottom: 1px solid var(--border); }
  .field-table td {
    padding: 8px 6px;
    vertical-align: top;
  }
  .field-label {
    width: 160px;
    color: var(--text-dim);
    font-weight: 600;
    font-size: 12px;
    white-space: nowrap;
    padding-right: 12px;
  }
  .field-value {
    word-break: break-word;
    line-height: 1.5;
  }
  .field-value.empty { color: var(--text-dim); font-style: italic; }

  .ref-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    margin: 2px 4px 2px 0;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid transparent;
    cursor: pointer;
    font-size: 12.5px;
    font-weight: 600;
  }
  .ref-pill:hover { border-color: var(--accent); }
  .ref-pill .arrow { opacity: 0.6; }

  .loading, .placeholder {
    color: var(--text-dim);
    padding: 20px;
  }

  /* ---------- Edit mode ---------- */
  .detail-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  .btn-primary, .btn-secondary {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1px solid transparent;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.92; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { background: #fff; border-color: var(--border); color: var(--text); }
  .btn-secondary:hover { background: var(--panel-bg); }

  .field-table input[type="text"],
  .field-table input[type="number"],
  .field-table input[type="date"],
  .field-table input[type="datetime-local"],
  .field-table textarea {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    color: var(--text);
  }
  .field-table textarea { resize: vertical; }
  .field-table input:focus, .field-table textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .readonly-note {
    color: var(--text-dim);
    font-size: 11px;
    margin-left: 4px;
  }
  .refs-readonly .ref-pill { cursor: default; pointer-events: none; opacity: 0.85; }
</style>
</head>
<body>
  <div id="app">
    <div id="topbar">
      <select id="tableSelect"><option>Loading tables…</option></select>
      <input id="searchInput" type="text" placeholder="Search…" disabled />
    </div>
    <div id="status"></div>
    <div id="main">
      <div id="resultsPane"><div class="empty-msg">Loading…</div></div>
      <div id="detailPane"><div class="placeholder">Select a table, then search and click a result to see its details here.</div></div>
    </div>
  </div>

<script>
/* ================================================================
   CONFIG — this is the main place to customize the widget for
   your specific document/scenario. Nothing below this block
   should need to change for basic customization.
   ================================================================ */
const CONFIG = {
  // tableId -> colId to use as each record's display title.
  // If a table isn't listed here, the widget guesses (first Text
  // column, falling back to "row #<id>").
  titleFields: {
    // Projects: 'Name',
    // SchoolBoard: 'BoardName',
  },

  // tableId -> array of colIds to restrict search to. If a table
  // isn't listed here, the widget searches all Text/Choice/Numeric
  // columns.
  searchableFields: {
    // Projects: ['Name', 'Location'],
  },

  // tableId -> array of colIds to hide from the detail panel.
  hiddenFields: {
    // Projects: ['InternalNotes'],
  },

  // tableId -> array of colIds that should display but never be
  // editable, even though they're a plain editable type. Formula
  // columns and Reference/Reference List columns are already
  // non-editable automatically.
  readOnlyFields: {
    // Projects: ['CreatedBy'],
  },

  // tableId -> function(record, columns, helpers) -> HTML string.
  // Lets you fully override how a table's detail panel renders.
  // `helpers.fieldRow(label, valueHtml)` builds a consistent row,
  // `helpers.escapeHtml(str)` escapes text,
  // `helpers.refPill(tableId, rowId, label)` builds a clickable
  // reference pill that drills into another table's record.
  customRenderers: {
    // Projects: (record, columns, helpers) => `...custom html...`,
  },

  // Table IDs to exclude from the table picker (metadata / internal
  // tables are already excluded automatically).
  excludeTables: [
    // 'ArchivedLog',
  ],
};

/* ================================================================
   STATE
   ================================================================ */
const state = {
  schema: {},         // tableId -> { columns: [{colId,label,type,isRef,isRefList,refTableId,isFormula}] }
  tableIds: [],        // user-facing table ids
  currentTable: null,  // table currently being searched
  recordsCache: {},    // tableId -> array of records (raw, with column values)
  recordsById: {},      // tableId -> Map(rowId -> record)
  searchResults: [],
  stack: [],           // navigation stack: [{tableId, rowId}]
  editing: false,       // whether the current top-of-stack record is in edit mode
};

/* ================================================================
   DOM refs
   ================================================================ */
const el = {
  tableSelect: document.getElementById('tableSelect'),
  searchInput: document.getElementById('searchInput'),
  status: document.getElementById('status'),
  resultsPane: document.getElementById('resultsPane'),
  detailPane: document.getElementById('detailPane'),
};

function setStatus(msg, isError) {
  el.status.textContent = msg || '';
  el.status.className = isError ? 'error' : '';
}

/* ================================================================
   GRIST INIT
   ================================================================ */
grist.ready({
  requiredAccess: 'full', // needed to read arbitrary tables & follow links
});

init().catch(err => {
  console.error(err);
  setStatus('Error initializing widget: ' + err.message, true);
});

async function init() {
  setStatus('Loading document schema…');
  const { schema, tableIds } = await loadSchema();
  state.schema = schema;
  state.tableIds = tableIds;

  el.tableSelect.innerHTML = tableIds
    .map(id => `<option value="${escapeHtml(id)}">${escapeHtml(id)}</option>`)
    .join('');

  if (tableIds.length === 0) {
    setStatus('No tables found in this document.', true);
    return;
  }

  el.tableSelect.disabled = false;
  el.searchInput.disabled = false;
  el.tableSelect.addEventListener('change', onTableChange);
  el.searchInput.addEventListener('input', onSearchInput);

  state.currentTable = tableIds[0];
  await ensureTableCached(state.currentTable);
  setStatus('');
  renderResults(''); // show all rows initially
}

/* ================================================================
   SCHEMA LOADING
   Reads Grist's internal metadata tables to discover every table,
   its columns, and which columns are Reference / Reference List
   links to other tables.
   ================================================================ */
async function loadSchema() {
  const tablesData = await grist.docApi.fetchTable('_grist_Tables');
  const tables = tableDataToRecords(tablesData);

  const tableRefToId = {};
  const tableIds = [];
  for (const t of tables) {
    tableRefToId[t.id] = t.tableId;
    // Skip Grist's own summary tables and anything explicitly excluded.
    if (t.tableId.includes('GristSummary')) continue;
    if (CONFIG.excludeTables.includes(t.tableId)) continue;
    tableIds.push(t.tableId);
  }

  const colsData = await grist.docApi.fetchTable('_grist_Tables_column');
  const cols = tableDataToRecords(colsData);

  const schema = {};
  for (const id of tableIds) schema[id] = { columns: [] };

  for (const c of cols) {
    if (c.colId === 'manualSort') continue;
    if (typeof c.colId === 'string' && c.colId.startsWith('gristHelper_')) continue;
    const tableId = tableRefToId[c.parentId];
    if (!tableId || !schema[tableId]) continue;

    const type = c.type || '';
    const isRef = type.startsWith('Ref:');
    const isRefList = type.startsWith('RefList:');
    schema[tableId].columns.push({
      colId: c.colId,
      label: c.label || c.colId,
      type,
      isRef,
      isRefList,
      refTableId: (isRef || isRefList) ? type.split(':')[1] : null,
      isFormula: !!c.isFormula,
    });
  }

  return { schema, tableIds };
}

function tableDataToRecords(tableData) {
  const { id, ...cols } = tableData;
  const colNames = Object.keys(cols);
  return id.map((rowId, i) => {
    const rec = { id: rowId };
    for (const c of colNames) rec[c] = cols[c][i];
    return rec;
  });
}

/* ================================================================
   DATA FETCHING / CACHING
   ================================================================ */
async function ensureTableCached(tableId) {
  if (state.recordsCache[tableId]) return state.recordsCache[tableId];
  const raw = await grist.docApi.fetchTable(tableId);
  const records = tableDataToRecords(raw);
  state.recordsCache[tableId] = records;
  const byId = new Map();
  for (const r of records) byId.set(r.id, r);
  state.recordsById[tableId] = byId;
  return records;
}

function getTitleField(tableId) {
  if (CONFIG.titleFields[tableId]) return CONFIG.titleFields[tableId];
  const cols = state.schema[tableId]?.columns || [];
  const textCol = cols.find(c => c.type === 'Text');
  return textCol ? textCol.colId : null;
}

function getRecordTitle(tableId, record) {
  if (!record) return '(missing record)';
  const titleField = getTitleField(tableId);
  const val = titleField ? record[titleField] : null;
  if (val === null || val === undefined || val === '') return `#${record.id}`;
  return String(val);
}

/* ================================================================
   SEARCH
   ================================================================ */
function onTableChange(e) {
  state.currentTable = e.target.value;
  state.stack = [];
  state.editing = false;
  el.searchInput.value = '';
  el.detailPane.innerHTML = '<div class="placeholder">Search and click a result to see its details here.</div>';
  ensureTableCached(state.currentTable)
    .then(() => renderResults(''))
    .catch(err => setStatus('Error loading table: ' + err.message, true));
}

function onSearchInput(e) {
  renderResults(e.target.value);
}

function getSearchableCols(tableId) {
  if (CONFIG.searchableFields[tableId]) {
    const set = new Set(CONFIG.searchableFields[tableId]);
    return (state.schema[tableId]?.columns || []).filter(c => set.has(c.colId));
  }
  return (state.schema[tableId]?.columns || []).filter(
    c => ['Text', 'Choice', 'Int', 'Numeric'].includes(c.type) || c.type === ''
  );
}

function renderResults(query) {
  const tableId = state.currentTable;
  const records = state.recordsCache[tableId] || [];
  const cols = getSearchableCols(tableId);
  const q = query.trim().toLowerCase();

  const matches = !q
    ? records
    : records.filter(r =>
        cols.some(c => {
          const v = r[c.colId];
          return v !== null && v !== undefined && String(v).toLowerCase().includes(q);
        })
      );

  state.searchResults = matches;

  if (matches.length === 0) {
    el.resultsPane.innerHTML = `<div class="empty-msg">No matches${q ? ` for "${escapeHtml(query)}"` : ''}.</div>`;
    return;
  }

  const activeId = state.stack.length && state.stack[0].tableId === tableId ? state.stack[0].rowId : null;

  el.resultsPane.innerHTML = matches.slice(0, 300).map(r => {
    const title = getRecordTitle(tableId, r);
    const sub = getResultSubtitle(tableId, r);
    const active = r.id === activeId ? ' active' : '';
    return `<div class="result-item${active}" data-row-id="${r.id}">
      <div class="result-title">${escapeHtml(title)}</div>
      ${sub ? `<div class="result-sub">${escapeHtml(sub)}</div>` : ''}
    </div>`;
  }).join('');

  el.resultsPane.querySelectorAll('.result-item').forEach(node => {
    node.addEventListener('click', () => {
      const rowId = Number(node.dataset.rowId);
      openRecord(tableId, rowId, { resetStack: true });
    });
  });
}

// Shows a second field under the title in the results list, e.g. a
// second identifying column. Customize per table if useful.
function getResultSubtitle(tableId, record) {
  const cols = state.schema[tableId]?.columns || [];
  const titleField = getTitleField(tableId);
  const secondCol = cols.find(c => c.colId !== titleField && c.type === 'Text');
  if (!secondCol) return '';
  const v = record[secondCol.colId];
  return v ? String(v) : '';
}

/* ================================================================
   NAVIGATION / DETAIL RENDERING
   ================================================================ */
async function openRecord(tableId, rowId, { resetStack = false } = {}) {
  try {
    setStatus('Loading record…');
    await ensureTableCached(tableId);
    const record = state.recordsById[tableId]?.get(rowId);
    if (!record) {
      setStatus(`Record #${rowId} not found in ${tableId}.`, true);
      return;
    }

    state.editing = false;
    if (resetStack) {
      state.stack = [{ tableId, rowId }];
    } else {
      state.stack.push({ tableId, rowId });
    }

    // Refresh the results list highlight if we're viewing the searched table.
    if (tableId === state.currentTable) {
      renderResults(el.searchInput.value);
    }

    await renderDetail();
    setStatus('');
  } catch (err) {
    console.error(err);
    setStatus('Error opening record: ' + err.message, true);
  }
}

function goToBreadcrumb(index) {
  state.editing = false;
  state.stack = state.stack.slice(0, index + 1);
  renderDetail();
}

async function renderDetail() {
  if (state.stack.length === 0) {
    el.detailPane.innerHTML = '<div class="placeholder">Select a table, then search and click a result to see its details here.</div>';
    return;
  }

  el.detailPane.innerHTML = '<div class="loading">Loading…</div>';

  const top = state.stack[state.stack.length - 1];
  const tableId = top.tableId;
  await ensureTableCached(tableId);
  const record = state.recordsById[tableId]?.get(top.rowId);
  const columns = (state.schema[tableId]?.columns || []).filter(
    c => !(CONFIG.hiddenFields[tableId] || []).includes(c.colId)
  );

  const helpers = { fieldRow, escapeHtml, refPill: (t, id, label) => refPillHtml(t, id, label) };

  let bodyHtml;
  let actionsHtml;
  if (state.editing) {
    bodyHtml = await renderEditForm(tableId, record, columns);
    actionsHtml = `<div class="detail-actions">
      <button id="saveBtn" class="btn-primary">Save</button>
      <button id="cancelBtn" class="btn-secondary">Cancel</button>
    </div>`;
  } else {
    bodyHtml = CONFIG.customRenderers[tableId]
      ? await CONFIG.customRenderers[tableId](record, columns, helpers)
      : await renderDefaultFieldTable(tableId, record, columns);
    actionsHtml = `<div class="detail-actions"><button id="editBtn" class="btn-secondary">Edit</button></div>`;
  }

  const breadcrumbsHtml = renderBreadcrumbs();
  const title = getRecordTitle(tableId, record);

  el.detailPane.innerHTML = `
    ${breadcrumbsHtml}
    <div class="detail-header">${escapeHtml(title)}</div>
    <div class="detail-subheader">${escapeHtml(tableId)} · row #${record.id}</div>
    ${actionsHtml}
    ${bodyHtml}
  `;

  // Wire up ref pill clicks (disabled while editing so you can't
  // navigate away mid-edit and lose unsaved changes).
  el.detailPane.querySelectorAll('[data-ref-table]').forEach(node => {
    node.addEventListener('click', () => {
      if (state.editing) return;
      openRecord(node.dataset.refTable, Number(node.dataset.refRow));
    });
  });
  el.detailPane.querySelectorAll('.crumb[data-crumb-index]').forEach(node => {
    node.addEventListener('click', () => {
      if (!state.editing) goToBreadcrumb(Number(node.dataset.crumbIndex));
    });
  });

  const editBtn = document.getElementById('editBtn');
  if (editBtn) editBtn.addEventListener('click', () => { state.editing = true; renderDetail(); });

  const cancelBtn = document.getElementById('cancelBtn');
  if (cancelBtn) cancelBtn.addEventListener('click', () => { state.editing = false; renderDetail(); });

  const saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.addEventListener('click', () => saveEdit(tableId, record, columns));
}

function renderBreadcrumbs() {
  if (state.stack.length <= 1) return '';
  const crumbs = state.stack.map((s, i) => {
    const record = state.recordsById[s.tableId]?.get(s.rowId);
    const title = getRecordTitle(s.tableId, record);
    const isCurrent = i === state.stack.length - 1;
    return `<span class="crumb${isCurrent ? ' current' : ''}" ${isCurrent ? '' : `data-crumb-index="${i}"`}>${escapeHtml(title)}</span>`;
  });
  return `<div id="breadcrumbs">${crumbs.join('<span class="crumb-sep">›</span>')}</div>`;
}

/* ---------- Default (generic) field rendering ---------- */
async function renderDefaultFieldTable(tableId, record, columns) {
  const rows = await Promise.all(columns.map(col => renderFieldRow(record, col)));
  return `<table class="field-table"><tbody>${rows.join('')}</tbody></table>`;
}

async function renderFieldRow(record, col) {
  const raw = record[col.colId];
  let valueHtml;

  if (col.isRef) {
    const rowId = normalizeRef(raw);
    valueHtml = rowId
      ? await refPillHtml(col.refTableId, rowId)
      : '<span class="field-value empty">(empty)</span>';
  } else if (col.isRefList) {
    const rowIds = normalizeRefList(raw);
    if (rowIds.length === 0) {
      valueHtml = '<span class="field-value empty">(empty)</span>';
    } else {
      const pills = await Promise.all(rowIds.map(id => refPillHtml(col.refTableId, id)));
      valueHtml = pills.join('');
    }
  } else {
    valueHtml = formatPlainValue(col.type, raw);
  }

  return fieldRow(col.label, valueHtml);
}

function fieldRow(label, valueHtml) {
  return `<tr><td class="field-label">${escapeHtml(label)}</td><td class="field-value">${valueHtml}</td></tr>`;
}

/* ---------- Edit-mode field rendering ---------- */
// Reference / Reference List / formula columns aren't editable inline
// (changing a link needs a record picker, and formulas are computed) —
// they're shown read-only here. Everything else gets a typed input.
async function renderEditForm(tableId, record, columns) {
  const readOnlySet = new Set(CONFIG.readOnlyFields[tableId] || []);

  const rows = await Promise.all(columns.map(async col => {
    if (col.isRef || col.isRefList || col.isFormula || readOnlySet.has(col.colId)) {
      let valueHtml;
      if (col.isRef) {
        const rowId = normalizeRef(record[col.colId]);
        valueHtml = rowId ? await refPillHtml(col.refTableId, rowId) : '<span class="field-value empty">(empty)</span>';
      } else if (col.isRefList) {
        const rowIds = normalizeRefList(record[col.colId]);
        valueHtml = rowIds.length
          ? (await Promise.all(rowIds.map(id => refPillHtml(col.refTableId, id)))).join('')
          : '<span class="field-value empty">(empty)</span>';
      } else {
        valueHtml = formatPlainValue(col.type, record[col.colId]);
      }
      const note = col.isFormula ? 'formula' : (col.isRef || col.isRefList) ? 'linked field' : 'read-only';
      return `<tr><td class="field-label">${escapeHtml(col.label)}</td><td class="field-value refs-readonly">${valueHtml}<span class="readonly-note">(${note})</span></td></tr>`;
    }
    return `<tr><td class="field-label">${escapeHtml(col.label)}</td><td class="field-value">${renderInputForColumn(col, record[col.colId])}</td></tr>`;
  }));

  return `<table class="field-table"><tbody>${rows.join('')}</tbody></table>`;
}

function renderInputForColumn(col, value) {
  const colAttr = escapeHtml(col.colId);

  if (col.type === 'Bool') {
    return `<input type="checkbox" data-col="${colAttr}" ${value ? 'checked' : ''} />`;
  }
  if (col.type === 'Numeric' || col.type === 'Int') {
    const v = (value === null || value === undefined) ? '' : value;
    return `<input type="number" step="any" data-col="${colAttr}" value="${escapeHtml(String(v))}" />`;
  }
  if (col.type === 'Date') {
    const iso = typeof value === 'number' ? new Date(value * 1000).toISOString().slice(0, 10) : '';
    return `<input type="date" data-col="${colAttr}" value="${iso}" />`;
  }
  if (col.type === 'DateTime') {
    const iso = typeof value === 'number' ? new Date(value * 1000).toISOString().slice(0, 16) : '';
    return `<input type="datetime-local" data-col="${colAttr}" value="${iso}" />`;
  }
  if (col.type === 'ChoiceList') {
    const items = Array.isArray(value) ? (value[0] === 'L' ? value.slice(1) : value) : [];
    return `<input type="text" data-col="${colAttr}" data-type="ChoiceList" value="${escapeHtml(items.join(', '))}" placeholder="comma-separated" />`;
  }

  // Text, Choice, and anything untyped.
  const strVal = (value === null || value === undefined) ? '' : String(value);
  if (strVal.length > 60) {
    return `<textarea data-col="${colAttr}" rows="4">${escapeHtml(strVal)}</textarea>`;
  }
  return `<input type="text" data-col="${colAttr}" value="${escapeHtml(strVal)}" />`;
}

// Reads the edit form's inputs, writes the changes straight into the
// live Grist document via applyUserActions, then updates the local
// cache in place so the UI reflects the change immediately.
async function saveEdit(tableId, record, columns) {
  const colByColId = Object.fromEntries(columns.map(c => [c.colId, c]));
  const changed = {};

  el.detailPane.querySelectorAll('[data-col]').forEach(node => {
    const col = colByColId[node.dataset.col];
    if (!col) return;

    let newVal;
    if (col.type === 'Bool') {
      newVal = node.checked;
    } else if (col.type === 'Numeric' || col.type === 'Int') {
      newVal = node.value === '' ? null : Number(node.value);
    } else if (col.type === 'Date') {
      newVal = node.value ? Math.floor(new Date(node.value + 'T00:00:00Z').getTime() / 1000) : null;
    } else if (col.type === 'DateTime') {
      newVal = node.value ? Math.floor(new Date(node.value).getTime() / 1000) : null;
    } else if (node.dataset.type === 'ChoiceList') {
      const items = node.value.split(',').map(s => s.trim()).filter(Boolean);
      newVal = items.length ? ['L', ...items] : null;
    } else {
      newVal = node.value;
    }
    changed[col.colId] = newVal;
  });

  if (Object.keys(changed).length === 0) {
    state.editing = false;
    renderDetail();
    return;
  }

  const saveBtn = document.getElementById('saveBtn');
  if (saveBtn) saveBtn.disabled = true;
  setStatus('Saving to Grist…');

  try {
    await grist.docApi.applyUserActions([
      ['UpdateRecord', tableId, record.id, changed],
    ]);

    // Real-time local update — no need to re-fetch the whole table.
    Object.assign(record, changed);

    state.editing = false;
    if (tableId === state.currentTable) renderResults(el.searchInput.value);
    await renderDetail();
    setStatus('Saved.');
  } catch (err) {
    console.error(err);
    setStatus('Error saving to Grist: ' + err.message, true);
    if (saveBtn) saveBtn.disabled = false;
  }
}

async function refPillHtml(tableId, rowId, forcedLabel) {
  let label = forcedLabel;
  if (!label) {
    try {
      await ensureTableCached(tableId);
      const record = state.recordsById[tableId]?.get(rowId);
      label = getRecordTitle(tableId, record);
    } catch {
      label = `#${rowId}`;
    }
  }
  return `<span class="ref-pill" data-ref-table="${escapeHtml(tableId)}" data-ref-row="${rowId}">${escapeHtml(label)} <span class="arrow">→</span></span>`;
}

function formatPlainValue(type, val) {
  if (val === null || val === undefined || val === '') {
    return '<span class="field-value empty">(empty)</span>';
  }
  if (type === 'Bool') {
    return val ? 'Yes' : 'No';
  }
  if (type === 'Date' && typeof val === 'number') {
    return new Date(val * 1000).toLocaleDateString();
  }
  if (type === 'DateTime' && typeof val === 'number') {
    return new Date(val * 1000).toLocaleString();
  }
  if (type === 'ChoiceList' || (Array.isArray(val) && val[0] === 'L')) {
    const items = Array.isArray(val) ? val.slice(1) : [];
    return items.map(v => `<span class="ref-pill" style="cursor:default">${escapeHtml(String(v))}</span>`).join('');
  }
  if (typeof val === 'object') {
    return escapeHtml(JSON.stringify(val));
  }
  return escapeHtml(String(val));
}

/* ---------- Reference value normalization ---------- */
// Grist stores a single Reference as a plain row-id number (0/empty
// when unset). Reference Lists come back as either a tagged array
// ['L', id1, id2, ...] or a plain array of numbers, depending on
// context — this handles both.
function normalizeRef(val) {
  if (typeof val === 'number' && val > 0) return val;
  return null;
}

function normalizeRefList(val) {
  if (!val) return [];
  if (Array.isArray(val)) {
    if (val[0] === 'L') return val.slice(1).filter(v => typeof v === 'number');
    return val.filter(v => typeof v === 'number');
  }
  return [];
}

/* ---------- Utilities ---------- */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}
